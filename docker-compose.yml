# Services communicate over the private Compose network. The gateway is the intended public API entry point.
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "${SQLSERVER_PORT}:1433"
    volumes:
      - waec-sql-data:/var/opt/mssql

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "${RABBITMQ_PORT}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  auth:
    build:
      context: .
      dockerfile: src/AuthService/Dockerfile
    environment:
      ASPNETCORE_URLS: ${ASPNETCORE_URLS}
      ConnectionStrings__Auth: "Server=sqlserver,1433;Database=${AUTH_DB_NAME};User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Jwt__Key: ${JWT_KEY}
      Jwt__AccessTokenMinutes: ${JWT_ACCESS_TOKEN_MINUTES}
      Jwt__RefreshTokenDays: ${JWT_REFRESH_TOKEN_DAYS}
      BootstrapAdmin__Email: ${ADMIN_EMAIL}
      BootstrapAdmin__Password: ${ADMIN_PASSWORD}
    ports:
      - "${AUTH_PORT}:8080"
    depends_on:
      sqlserver:
        condition: service_started
    restart: unless-stopped

  catalog:
    build:
      context: .
      dockerfile: src/CatalogService/Dockerfile
    environment:
      ASPNETCORE_URLS: ${ASPNETCORE_URLS}
    ports:
      - "${CATALOG_PORT}:8080"

  orders:
    build:
      context: .
      dockerfile: src/OrdersService/Dockerfile
    environment:
      ASPNETCORE_URLS: ${ASPNETCORE_URLS}
      Catalog__BaseUrl: ${CATALOG_BASE_URL}
    ports:
      - "${ORDERS_PORT}:8080"
    depends_on:
      - catalog

  registration:
    build:
      context: .
      dockerfile: src/RegistrationService/Dockerfile
    environment:
      ASPNETCORE_URLS: ${ASPNETCORE_URLS}
      ConnectionStrings__Registrations: "Server=sqlserver,1433;Database=${REGISTRATION_DB_NAME};User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"
      RabbitMq__Host: rabbitmq
      RabbitMq__User: ${RABBITMQ_USER}
      RabbitMq__Password: ${RABBITMQ_PASSWORD}
    ports:
      - "${REGISTRATION_PORT}:8080"
    depends_on:
      sqlserver:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  student:
    build:
      context: .
      dockerfile: src/StudentService/Dockerfile
    environment:
      ASPNETCORE_URLS: ${ASPNETCORE_URLS}
      ConnectionStrings__Students: "Server=${HOST_DB_SERVER};Database=${STUDENT_DB_NAME};User Id=${HOST_DB_USER};Password=${HOST_DB_PASSWORD};TrustServerCertificate=True;"
      RabbitMq__Host: rabbitmq
      RabbitMq__User: ${RABBITMQ_USER}
      RabbitMq__Password: ${RABBITMQ_PASSWORD}
    ports:
      - "${STUDENT_PORT}:8080"
    depends_on:
      rabbitmq:
        condition: service_healthy

  school:
    build:
      context: .
      dockerfile: src/SchoolService/Dockerfile
    environment:
      ASPNETCORE_URLS: ${ASPNETCORE_URLS}
      ConnectionStrings__Schools: "Server=${HOST_DB_SERVER};Database=${SCHOOL_DB_NAME};User Id=${HOST_DB_USER};Password=${HOST_DB_PASSWORD};TrustServerCertificate=True;"
      RabbitMq__Host: rabbitmq
      RabbitMq__User: ${RABBITMQ_USER}
      RabbitMq__Password: ${RABBITMQ_PASSWORD}
    ports:
      - "${SCHOOL_PORT}:8080"
    depends_on:
      rabbitmq:
        condition: service_healthy

  notification-worker:
    build:
      context: .
      dockerfile: src/NotificationWorker/Dockerfile
    environment:
      RabbitMq__Host: rabbitmq
      RabbitMq__User: ${RABBITMQ_USER}
      RabbitMq__Password: ${RABBITMQ_PASSWORD}
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: src/ExamGateway/Dockerfile
    environment:
      ASPNETCORE_URLS: ${ASPNETCORE_URLS}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Jwt__Key: ${JWT_KEY}
      ReverseProxy__Clusters__auth__Destinations__destination1__Address: ${AUTH_CLUSTER_URL}
      ReverseProxy__Clusters__catalog__Destinations__destination1__Address: ${CATALOG_CLUSTER_URL}
      ReverseProxy__Clusters__orders__Destinations__destination1__Address: ${ORDERS_CLUSTER_URL}
      ReverseProxy__Clusters__registration__Destinations__destination1__Address: ${REGISTRATION_CLUSTER_URL}
      ReverseProxy__Clusters__student__Destinations__destination1__Address: ${STUDENT_CLUSTER_URL}
      ReverseProxy__Clusters__school__Destinations__destination1__Address: ${SCHOOL_CLUSTER_URL}

    ports:
      - "${GATEWAY_PORT}:8080"
    depends_on:
      - auth
      - catalog
      - orders
      - student
      - registration
      - school

volumes:
  waec-sql-data:
